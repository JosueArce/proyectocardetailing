steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--build-arg', 'VITE_GA_MEASUREMENT_ID=${_GA_MEASUREMENT_ID}', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=0
      - --max-instances=3
      - --memory=512Mi
      - --cpu=1
      - --timeout=300
      - --service-account=estudio-auto-calendar@$PROJECT_ID.iam.gserviceaccount.com
      - --update-env-vars=STORAGE_BUCKET=$PROJECT_ID-estudio-auto-evidence,ADMIN_EMAIL=josue.arce.gonzalez@gmail.com
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA'
substitutions:
  _REGION: us-west1
  _REPOSITORY: car-detailing
  _SERVICE: proyectocardetailing
  _GA_MEASUREMENT_ID: ''
options:
  logging: CLOUD_LOGGING_ONLY
